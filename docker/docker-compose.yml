version: "3.8"
services:
  carla-server:
    build:
      context: .
      dockerfile: Dockerfile.carla
    image: carla-udacity:0.9.9.4
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    restart: unless-stopped
    privileged: true
